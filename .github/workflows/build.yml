name: build

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
      - 'bugfix/**'
      - 'fix/**'
      - 'hotfix/**'
      - 'release/**'

  workflow_call:
    inputs:
      image_tag:
        description: "Optional Docker image tag"
        required: false
        type: string
        default: ""

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional Docker image tag"
        required: false
        type: string
        default: ""

env:
  IMAGE_NAMESPACE: 'harbor-hub-shared.arena.3ascloud.de/arena2036'
  IMAGE_NAME: 'portal-assets'
  SERVER_URL: '${{ github.server_url }}'
  REPOSITORY: '${{ github.repository }}'
  REF_NAME: '${{ github.ref_name }}'

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Dependencies
        run: yarn --frozen-lockfile

      - name: Create metadata
        run: yarn build:release

      - name: Add content to Legal Notice
        run: yarn build:legal-notice

      - name: Build Application
        run: yarn build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.HBR_REGISTRY }}
          username: ${{ secrets.HBR_USERNAME }}
          password: ${{ secrets.HBR_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}

      - name: Build Docker image for verification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .conf/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: portal-assets:test

      - name: Verify nginx version
        run: |
          docker run --rm --entrypoint nginx portal-assets:test -v 2>&1 | tee nginx-version.txt
          grep -Fx "nginx version: nginx/1.30.7" nginx-version.txt

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .conf/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
